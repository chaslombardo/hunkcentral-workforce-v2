name: CI/CD Pipeline

on:
  push:
  pull_request:

jobs:
  # Quality checks that run on every PR and push
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type checking
        run: npm run build

      - name: Run ESLint
        run: npm run lint

      - name: Check for console.log statements
        run: |
          if find . -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.jsx" | grep -v node_modules | grep -v ".next" | grep -v "__tests__" | xargs grep -l "console\.log" 2>/dev/null; then
            echo "❌ Found console.log statements in application code. Please remove them."
            find . -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.jsx" | grep -v node_modules | grep -v ".next" | grep -v "__tests__" | xargs grep -n "console\.log" 2>/dev/null || true
            exit 1
          else
            echo "✅ No console.log statements found in application code."
          fi

  # Comprehensive tests that run on main branch and PRs to main
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run --coverage
        env:
          CI: true
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        if: success()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Build verification for all branches
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          # Provide dummy values for build-time environment variables
          NEXTAUTH_URL: 'http://localhost:3000'
          NEXTAUTH_SECRET: 'dummy-secret-for-build'
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Check build output
        run: |
          if [ -d ".next" ]; then
            echo "✅ Build successful - .next directory created"
            ls -la .next/
          else
            echo "❌ Build failed - no .next directory found"
            exit 1
          fi

  # Security and dependency checks
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high

      - name: Check for outdated dependencies
        run: npm outdated || true

  # Performance and bundle analysis (only on main branch)
  performance:
    name: Performance Analysis
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Analyze bundle size
        run: |
          npm run build
          npx @next/bundle-analyzer || echo "Bundle analyzer not configured yet"

      - name: Comment bundle size (if PR)
        if: github.event_name == 'pull_request'
        run: |
          echo "Bundle analysis would be posted here in a real setup"
          # This would typically use a tool like bundlewatch or similar

name: Dependency Updates

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Check for outdated dependencies
        run: |
          npm outdated > outdated.txt || true
          if [ -s outdated.txt ]; then
            echo "📦 Outdated dependencies found:"
            cat outdated.txt
            echo "OUTDATED_DEPS=true" >> $GITHUB_ENV
          else
            echo "✅ All dependencies are up to date"
            echo "OUTDATED_DEPS=false" >> $GITHUB_ENV
          fi

      - name: Create issue for outdated dependencies
        if: env.OUTDATED_DEPS == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const outdated = fs.readFileSync('outdated.txt', 'utf8');

            const issueBody = `## 📦 Dependency Update Report

            The following dependencies are outdated:

            \`\`\`
            ${outdated}
            \`\`\`

            Please review and update these dependencies when appropriate.

            **Note:** This issue is automatically generated weekly.
            `;

            // Check if there's already an open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['dependencies', 'automated']
            });

            const existingIssue = issues.data.find(issue => 
              issue.title.includes('Dependency Update Report')
            );

            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: issueBody
              });
              console.log('Updated existing dependency issue');
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📦 Weekly Dependency Update Report',
                body: issueBody,
                labels: ['dependencies', 'automated', 'maintenance']
              });
              console.log('Created new dependency issue');
            }
